# What the secret scan in .github/workflows/ci.yml looks for, and the false positives it lets past
# (ADR-060).
#
# The default rules stay on: without the [extend] below the scan runs no rules and reports every
# commit clean. The job shows the scan a key on every run, so losing them turns it red.
#
# An [[allowlists]] entry here is how a false positive gets past the scan, as a change that says why.
# gitleaks' own default allowlist also drops some matches, and cannot be subtracted (ADR-060). Every
# entry needs all of:
#
# - description: why this is not a secret, naming what it actually is.
# - targetRules: only the rule it is about, so nothing else in the file is let past.
# - paths, and regexes with condition = "AND": the file and the whole text of this one false
#   positive, so that a real key in the same file is still found.
#
# The job counts description, targetRules and condition against the entries. It also fails on a
# .gitleaksignore, which silences a finding with no reason, and ignores gitleaks:allow comments,
# which would let a commit silence itself.
#
# A finding that is a real secret is rotated first. Only then does it get an entry, scoped by commits
# and paths, whose description names the rotation and its issue: the scan reads all history, and
# pushed history is not rewritten, so without one every run would stay red for good.

[extend]
useDefault = true

[[allowlists]]
description = "The PEM header and footer constants AccessTokenKey parses a key with. No key lies between them: the rule spans the two constants and the declaration that separates them."
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^backend/src/main/java/io/github/naimelijah/hrsched/access/adapter/out/token/AccessTokenKey\.java$''']
regexes = ['''^-----BEGIN PRIVATE KEY-----";\s+private static final String PEM_FOOTER = "-----END PRIVATE KEY-----$''']

[[allowlists]]
description = "A test value labelled invented in AccessTokenPropertiesTest: shaped like a PKCS#8 PEM, and decodes to nothing."
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^backend/src/test/java/io/github/naimelijah/hrsched/access/adapter/out/token/AccessTokenPropertiesTest\.java$''']
regexes = ['''^-----BEGIN PRIVATE KEY-----\\n"\s+\+ "MIIEvQInventedQzX9kLmWpTr7NvBcYhJd2fGs\\n"\s+\+ "Rq8Wn3EtUaVyKoZxPi5HbMjDlCe6SgFtQwNr4u\\n"\s+\+ "-----END PRIVATE KEY-----$''']
