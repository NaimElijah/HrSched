spring.application.name=HrSched

# No datasource is configured here, on purpose. Locally, compose.yaml supplies one and Boot's
# docker-compose support wires it up, so `./mvnw spring-boot:run` needs no environment. Under test,
# Testcontainers supplies one instead, and Boot skips the compose file. A deployment sets
# SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD - see .env.example. A committed URL would be a
# default that travels to somewhere it is wrong, which is the same reasoning as service.environment
# below. See ADR-004.

# Flyway is deliberately unconfigured too: it is on by default with the starter present, and it
# reads classpath:db/migration by default, which is where the migrations are. Migrations are the
# only way this schema changes, including on an empty database.

# Liveness and readiness probes are off by default outside Kubernetes; every service in this
# project exposes them, so enable them explicitly.
management.endpoint.health.probes.enabled=true
# metrics and prometheus join health and info. Deliberately not loggers, env or heapdump: this
# application has no authentication, so nothing here may change behaviour or hand out state.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Structured logs everywhere, including locally. A format only production emits is a format nobody
# reads until the day it matters, so there is deliberately no profile switching this off. ECS
# carries the MDC, which is where Micrometer Tracing puts the trace and span ids. See ADR-016.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@

# service.environment is deliberately unset. A committed default of "local" would travel to a real
# environment that forgot to override it and label production's logs as a laptop's, and a wrong
# value is worse than an absent field.

# Every request is sampled, because nothing is exported: the trace id exists to tie this process's
# own log lines together and to reach the browser, not to be shipped anywhere.
management.tracing.sampling.probability=1.0

# Nothing listens on an OTLP endpoint yet - that is Q19 - and an exporter with nowhere to send
# retries and logs its own failure forever. Instrumentation stays on; only the shipping is off.
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
