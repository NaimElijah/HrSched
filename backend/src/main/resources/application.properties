spring.application.name=HrSched

# No datasource is configured here, on purpose. Locally, compose.yaml supplies one and Boot's
# docker-compose support wires it up, so `./mvnw spring-boot:run` needs no environment. Under test,
# Testcontainers supplies one instead, and Boot skips the compose file. A deployment sets
# SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD - see .env.example. A committed URL would be a
# default that travels to somewhere it is wrong, which is the same reasoning as service.environment
# below. See ADR-004.

# The driver's server-error detail is off. On a refused write PostgreSQL's detail quotes the whole
# row - "Failing row contains (...)", a name, contracted hours, an absence - and pgjdbc puts it in
# the exception's message, which is logged at ERROR if it escapes. The constraint's name stays in
# the message, and that is all the repositories translate on.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Flyway is deliberately unconfigured too: it is on by default with the starter present, and it
# reads classpath:db/migration by default, which is where the migrations are. Migrations are the
# only way this schema changes, including on an empty database.

# Liveness and readiness probes are off by default outside Kubernetes; every service in this
# project exposes them, so enable them explicitly.
management.endpoint.health.probes.enabled=true
# metrics and prometheus join health and info. Deliberately not loggers, env or heapdump: the
# security chain lets anybody reach /actuator/** without a token (ADR-017, ADR-032), so nothing
# exposed here may change behaviour or hand out configuration or memory. Whether metrics and
# prometheus stay open is GitHub issue 78.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Structured logs everywhere, including locally. A format only production emits is a format nobody
# reads until the day it matters, so there is deliberately no profile switching this off. ECS
# carries the MDC, which is where Micrometer Tracing puts the trace and span ids. See ADR-016.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@

# service.environment is deliberately unset. A committed default of "local" would travel to a real
# environment that forgot to override it and label production's logs as a laptop's, and a wrong
# value is worse than an absent field.

# Every request is sampled, because nothing is exported: the trace id exists to tie this process's
# own log lines together and to reach the browser, not to be shipped anywhere.
management.tracing.sampling.probability=1.0

# Nothing listens on an OTLP endpoint yet - that is Q19 - and an exporter with nowhere to send
# retries and logs its own failure forever. Instrumentation stays on; only the shipping is off.
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

# Who signs access tokens and who they are for. Both are checked on every request, so a token
# minted elsewhere, or for another service, is not spendable here. See ADR-011.
hrsched.security.token.issuer=hrsched
hrsched.security.token.audience=hrsched-api
# Short on purpose: a stolen access token is useful only until it expires, and a session outlives
# its tokens through the refresh cookie rather than through a long-lived one. The number itself is
# a risk decision the owner reviews - Q27.
hrsched.security.token.lifetime=10m
# The signing key is deliberately NOT here. It comes from HRSCHED_SECURITY_TOKEN_PRIVATEKEY (see
# .env.example); a committed key is a key everybody has. Nor is the ephemeral flag, which only
# spring-boot:run and the test configuration set, so a deployment that forgot its key fails to
# start instead of inventing one nothing else can verify.

# Bcrypt's work factor: each increment doubles what one password check costs, for an attacker with
# the hashes and for this service on every sign-in alike. 12 is the current common floor; it is a
# number the owner reviews against the hardware this runs on - Q27.
hrsched.security.password.bcrypt-strength=12
# The shortest password somebody may choose for themselves, in characters. NIST SP 800-63B-4
# section 3.1.1.2 says verifiers "SHALL require passwords that are used as a single-factor
# authentication mechanism to be a minimum of 15 characters in length", and there is no second
# factor here (Q31). The same document says a verifier SHOULD permit at least 64; bcrypt's 72-byte
# ceiling leaves room for that in any Latin script, and less in others - which is why the ceiling
# is counted in bytes and this floor in characters. Q27.
hrsched.security.password.minimum-length=15
# The first platform operator is deliberately not configured here. It is a credential, so it comes
# from HRSCHED_BOOTSTRAP_OPERATOR_SIGNINNAME and _PASSWORD (see .env.example), and spring-boot:run
# supplies throwaway local values the way compose.yaml supplies a throwaway local database.

# When an account locks, and for how long. NIST SP 800-63B-4 section 3.2.2 (Rate Limiting) says a
# verifier "SHALL limit consecutive failed authentication attempts using a specific authenticator
# on a single subscriber account to no more than 100"; 10 is well inside that, because this is a
# workforce system where nobody has a hundred guesses' worth of legitimate confusion. A lock is
# also a way to keep somebody out on purpose, which is why the duration is minutes and not hours.
# Both numbers are the owner's to review - Q27.
hrsched.security.sign-in.lockout-threshold=10
hrsched.security.sign-in.lockout-duration=15m
# How long a session lives. The absolute lifetime is roughly one working day and is fixed when the
# session starts, so a stolen refresh token cannot keep a session alive by being used. The idle
# limit is how long it survives unrenewed, which is what closes a browser somebody walked away
# from. Q27 again.
hrsched.security.session.absolute-lifetime=12h
hrsched.security.session.idle-lifetime=1h

# How long each of the solver's two searches may run before it answers with the best roster it has
# found: coverage first, then the organisation's objectives (ADR-044). Generation runs in the
# background (ADR-046), so two of them may take the ten minutes the requirements allow a draft at
# the largest stated size. A small roster is solved to proven optimality long before either ends.
hrsched.generation.time-limit-per-phase=5m
# How many generations one instance solves at once; one asked for beyond that is refused with a 503
# rather than queued (ADR-046). Each solve already uses every core, so more at once only makes each
# slower. The number is the owner's to review against the hardware a deployment runs on (#170).
hrsched.generation.concurrent-runs=2
# How long after it is asked for a generation still pending reads as lost, because the instance
# solving it stopped. It must exceed the longest a solve may run, the two searches above, with room
# for the reads before them and the write after (ADR-046). Startup fails unless it exceeds the two
# searches.
hrsched.generation.lost-after=12m

# The longest JSON request body accepted, in bytes; anything longer is refused as a malformed
# request before any use case runs. Jackson's own defaults bound a single string at a hundred
# million characters and a document not at all, and sign-in is open to anybody, so without this one
# unauthenticated request could make the server buffer whatever it was sent. A mebibyte is generous
# for every request this API takes, and it bounds what any one request, signed in or not, can make
# the server hold.
hrsched.web.max-json-document-bytes=1048576
# Boot's own Jackson factory customiser turns this into Jackson's StreamReadConstraints, which count
# a UTF-8 body in bytes and check the whole of it, because the reader looks for trailing tokens
# after the root value. A body in another declared charset is counted in characters, which still
# bounds it. Our own name above is the one to change; this line only hands it to Jackson, and with
# no default, so a missing limit fails startup rather than reverting to none.
spring.jackson.factory.constraints.read.max-document-length=${hrsched.web.max-json-document-bytes}
