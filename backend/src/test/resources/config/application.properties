# Test-only configuration, layered over the application's own: Boot reads
# classpath:/config/application.properties in preference to classpath:/application.properties, and
# only the test classpath has this file.

# Tests sign with a throwaway key generated at startup, so the suite needs no secret and there is
# nothing to leak from a build log. A deployment has no such permission and fails without a key.
hrsched.security.token.ephemeral=true
