# Test-only configuration, layered over the application's own: Boot reads
# classpath:/config/application.properties in preference to classpath:/application.properties, and
# only the test classpath has this file.

# Tests sign with a throwaway key generated at startup, so the suite needs no secret and there is
# nothing to leak from a build log. A deployment has no such permission and fails without a key.
hrsched.security.token.ephemeral=true

# The cheapest work factor bcrypt allows. The suite hashes a great many passwords, and what the
# work factor protects is a stolen database rather than anything a test has.
hrsched.security.password.bcrypt-strength=4
# The real floor, not a lowered one: a test that passed against a shorter minimum would say nothing
# about the rule a deployment actually enforces.
hrsched.security.password.minimum-length=15

# An invented operator for the suite to sign in as. Both values are made up for tests and mean
# nothing anywhere else.
hrsched.bootstrap.operator.sign-in-name=test-bootstrap-operator
hrsched.bootstrap.operator.password=invented-test-operator-password

# A test on a real port listens on loopback alone. The operator sign-in above is committed, so on
# every interface anybody on the same network could sign in while the suite runs, against a
# database of invented data, but still a door nobody needs open.
server.address=127.0.0.1
