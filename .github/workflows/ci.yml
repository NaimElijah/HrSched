name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Deliberately the exact command a developer runs locally. Spotless is bound to the
      # validate phase in pom.xml, so this single invocation is the whole gate: format
      # check, compile, and tests. A CI-only variant would drift the day someone edits it.
      - name: Verify
        run: ./mvnw -B verify
