name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run on every push, with no path filters. ADR-007 warned that getting path filters
# wrong silently skips checks, and a check that is skipped still reports green — which is worse
# than one that is merely slow.
#
# Every action is pinned to a full commit SHA, with its version in a trailing comment. A tag can
# be moved to different code after it was trusted; a SHA cannot. Dependabot's github-actions
# entry keeps the pins and their comments current.
jobs:
  backend:
    name: Build, test, format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to stay on disk where every build
          # step - and every dependency's install or build script - could read it.
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # setup-java runs outside the job default, so the cache key needs the real path.
          cache-dependency-path: backend/pom.xml

      # Deliberately the exact command a developer runs locally. Spotless is bound to the
      # validate phase in pom.xml, so this single invocation is the whole gate: format
      # check, architecture rules, compile, and tests.
      - name: Verify
        run: ./mvnw -B verify

  frontend:
    name: Frontend format, lint, types, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to stay on disk where every build
          # step - and every dependency's install or build script - could read it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          # setup-node runs outside the job default, so the cache key needs the real path.
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Deliberately the exact command a developer runs locally, as ADR-002 requires of the
      # backend: format check, lint, types, tests and a production build in one invocation.
      - name: Verify
        run: npm run verify
