name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on every push, with no path filters. ADR-007 warned that getting path filters
# wrong silently skips checks, and a check that is skipped still reports green — which is worse
# than one that is merely slow.
#
# Every action is pinned to a full commit SHA, and the one container image by its digest, each
# with its version in a trailing comment. A tag can be moved to different code after it was
# trusted; a SHA or a digest cannot. Dependabot's github-actions entry keeps the action pins
# current; the image digest is bumped by hand (ADR-047).
jobs:
  backend:
    name: Build, test, format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to stay on disk where every build
          # step - and every dependency's install or build script - could read it.
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # setup-java runs outside the job default, so the cache key needs the real path.
          cache-dependency-path: backend/pom.xml

      # setup-java restores ~/.m2/wrapper/dists from the cache, and the wrapper runs a
      # distribution it already has without checking it. Removing it makes every run download
      # Maven and check it against distributionSha256Sum, so a poisoned cache cannot persist.
      - name: Make the wrapper check Maven
        run: rm -rf ~/.m2/wrapper/dists

      # Deliberately the exact command a developer runs locally. Spotless is bound to the
      # validate phase in pom.xml, so this single invocation is the whole gate: format
      # check, architecture rules, compile, and tests.
      - name: Verify
        run: ./mvnw -B verify

  frontend:
    name: Frontend format, lint, types, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to stay on disk where every build
          # step - and every dependency's install or build script - could read it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          # setup-node runs outside the job default, so the cache key needs the real path.
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Deliberately the exact command a developer runs locally, as ADR-002 requires of the
      # backend: format check, lint, types, tests and a production build in one invocation.
      - name: Verify
        run: npm run verify

  # Known vulnerabilities in what both projects depend on, Maven's transitive tree included
  # (ADR-047). Any advisory fails it, and so does any error: a scan that could not resolve what it
  # was given must never read as a clean one.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scanner honours an ignore without a date for ever, and a [[PackageOverrides]] entry
      # can silence whole packages. Neither is allowed (ADR-047), and nothing else enforces it.
      - name: Check the ignores
        run: |
          if grep -Eq '^[[:space:]]*\[\[PackageOverrides\]\]' osv-scanner.toml; then
            echo "::error file=osv-scanner.toml::[[PackageOverrides]] is not allowed (ADR-047)"
            exit 1
          fi
          entries=$(grep -Ec '^[[:space:]]*\[\[IgnoredVulns\]\]' osv-scanner.toml || true)
          dated=$(grep -Ec '^[[:space:]]*ignoreUntil[[:space:]]*=' osv-scanner.toml || true)
          reasoned=$(grep -Ec '^[[:space:]]*reason[[:space:]]*=' osv-scanner.toml || true)
          if [ "$entries" -ne "$dated" ] || [ "$entries" -ne "$reasoned" ]; then
            echo "::error file=osv-scanner.toml::every [[IgnoredVulns]] needs ignoreUntil and reason (ADR-047)"
            exit 1
          fi

      # The image by digest rather than the action that names it by tag, so what runs is what was
      # reviewed. A plain step, so any non-zero exit fails the job. Both manifests are named
      # rather than found by walking the tree: a named manifest that cannot be read or resolved is
      # an error, where a walked one is only logged.
      - name: Scan
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 # v2.7.0
        with:
          args: --config=./osv-scanner.toml --lockfile=./backend/pom.xml --lockfile=./frontend/package-lock.json
