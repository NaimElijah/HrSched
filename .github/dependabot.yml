version: 2

# Every entry targets dev: a branch reaches main only through a dev-to-main pull request, and an
# update merged straight into main would leave dev behind it. Dependabot reads this file from the
# default branch, so a change here takes effect once it has been promoted to main.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # From 9.13 on, OR-Tools' Windows libraries crash the JVM on the Visual C++ runtime JDK 21
      # bundles. Remove when the JDK developers run bundles 14.40 or later (ADR-044).
      - dependency-name: 'com.google.ortools:*'
        versions: ['>= 9.13']

  # ADR-007 warned that a second ecosystem needs its own entry, and that forgetting it means
  # silent non-coverage rather than a visible failure.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # @vitest/coverage-v8 peers the exact Vitest version (ADR-015), so a pull request that bumps
      # one without the other cannot pass npm ci.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # React throws at runtime unless react and react-dom are exactly the same version (#241), and
      # @types/react-dom peers the matching @types/react, so npm ci refuses one alone (#243).
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # typescript-eslint does not yet admit TypeScript 7 as a peer. Remove when it does (ADR-043).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # The backend image's base images (ADR-061). The JDK and the JRE are one group, so the two stages
  # move together, and Java majors are ignored, so the image stays on 21 until the pom moves. The
  # postgres image Dependabot also finds in compose.yaml is ignored until #62 gives the PostgreSQL
  # version one home: a bump there alone would leave the tests' PostgresDatabase behind it.
  - package-ecosystem: docker
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      temurin:
        patterns:
          - 'eclipse-temurin'
    ignore:
      - dependency-name: 'eclipse-temurin'
        update-types: ['version-update:semver-major']
      - dependency-name: 'postgres'

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
